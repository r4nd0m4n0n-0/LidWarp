name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Environment
      # --------------------------------------------------

      - name: Show environment
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Swift:"
          swift --version

          echo ""
          echo "Xcode:"
          xcodebuild -version

      # --------------------------------------------------
      # Resolve package
      # --------------------------------------------------

      - name: Resolve Swift package
        run: |
          swift package resolve

      # --------------------------------------------------
      # Build
      # --------------------------------------------------

      - name: Build
        run: |
          swift build -v

      # --------------------------------------------------
      # Tests
      # --------------------------------------------------

      - name: Run tests
        run: |
          mkdir -p build/test-output

          swift test -v 2>&1 | tee build/test-output/swift-test.txt

      # --------------------------------------------------
      # Test information
      # --------------------------------------------------

      - name: Capture test information
        if: always()
        run: |
          {
            echo "========================================"
            echo "Swift Package"
            echo "========================================"
            swift package describe

            echo ""
            echo "========================================"
            echo "Test Output"
            echo "========================================"

            if [ -f build/test-output/swift-test.txt ]; then
              cat build/test-output/swift-test.txt
            fi
          } > build/test-output/report.txt

      # --------------------------------------------------
      # Inspect source
      # --------------------------------------------------

      - name: Inspect project
        if: always()
        run: |
          mkdir -p build/diagnostics

          echo "========================================"
          echo "Project Files"
          echo "========================================"

          find Sources Tests -type f | sort \
            > build/diagnostics/project-files.txt

          cat build/diagnostics/project-files.txt

          echo ""
          echo "========================================"
          echo "Swift Files"
          echo "========================================"

          find Sources Tests \
            -type f \
            \( -name "*.swift" -o -name "*.yml" \) \
            -print \
            > build/diagnostics/swift-files.txt

          cat build/diagnostics/swift-files.txt

      # --------------------------------------------------
      # Inspect build directory
      # --------------------------------------------------

      - name: Inspect Swift build
        if: always()
        run: |
          echo "========================================"
          echo ".build Contents"
          echo "========================================"

          find .build -maxdepth 4 -type f | sort \
            > build/diagnostics/build-files.txt

          cat build/diagnostics/build-files.txt

      # --------------------------------------------------
      # Render preview artifacts
      # --------------------------------------------------

      - name: Collect render previews
        if: always()
        run: |
          mkdir -p build/render-preview

          found=0

          while IFS= read -r file; do
            cp "$file" build/render-preview/
            found=1
          done < <(
            find . \
              -type f \
              \( -iname "*.png" -o -iname "*.PNG" \) \
              -not -path "./.git/*" \
              -not -path "./.build/*" \
              -not -path "./build/*"
          )

          if [ "$found" -eq 0 ]; then
            echo "No PNG render previews found."
          else
            echo "Render previews:"
            find build/render-preview \
              -type f \
              -print
          fi

      # --------------------------------------------------
      # Render preview report
      # --------------------------------------------------

      - name: Create render preview report
        if: always()
        run: |
          {
            echo "RetroPhosphor Render Preview"
            echo "============================"
            echo ""

            if find build/render-preview \
              -type f \
              -iname "*.png" \
              -print -quit | grep -q .; then

              echo "PNG previews found:"
              find build/render-preview \
                -type f \
                -iname "*.png" \
                -print

            else
              echo "No PNG previews were produced."
            fi
          } > build/render-preview/report.txt

      # --------------------------------------------------
      # Locate executable
      # --------------------------------------------------

      - name: Locate executable
        run: |
          echo "Searching for RetroPhosphor executable..."

          EXECUTABLE="$(
            find .build \
              -type f \
              -name "RetroPhosphor" \
              -perm -111 \
              | head -n 1
          )"

          if [ -z "$EXECUTABLE" ]; then
            echo "ERROR: RetroPhosphor executable not found."
            exit 1
          fi

          echo "Found:"
          echo "$EXECUTABLE"

          cp "$EXECUTABLE" build/RetroPhosphor

          chmod +x build/RetroPhosphor

      # --------------------------------------------------
      # Create application bundle
      # --------------------------------------------------

      - name: Create RetroPhosphor.app
        run: |
          APP="build/RetroPhosphor.app"

          mkdir -p \
            "$APP/Contents/MacOS" \
            "$APP/Contents/Resources"

          cp \
            build/RetroPhosphor \
            "$APP/Contents/MacOS/RetroPhosphor"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>RetroPhosphor</string>

              <key>CFBundleExecutable</key>
              <string>RetroPhosphor</string>

              <key>CFBundleIdentifier</key>
              <string>com.retro-phosphor.app</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>RetroPhosphor</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>

              <key>LSUIElement</key>
              <true/>

              <key>NSHighResolutionCapable</key>
              <true/>

              <key>NSScreenCaptureUsageDescription</key>
              <string>RetroPhosphor needs Screen Recording access to capture the display and apply the visual effect.</string>
          </dict>
          </plist>
          PLIST

          echo "Application bundle:"
          find "$APP" -maxdepth 3 -print

      # --------------------------------------------------
      # Validate Info.plist
      # --------------------------------------------------

      - name: Validate Info.plist
        run: |
          plutil \
            -lint \
            build/RetroPhosphor.app/Contents/Info.plist

          echo ""
          echo "Bundle information:"
          plutil \
            -p \
            build/RetroPhosphor.app/Contents/Info.plist

      # --------------------------------------------------
      # Ad-hoc code signing
      # --------------------------------------------------

      - name: Code sign application
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            build/RetroPhosphor.app

      # --------------------------------------------------
      # Verify signature
      # --------------------------------------------------

      - name: Verify code signature
        run: |
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            build/RetroPhosphor.app

      # --------------------------------------------------
      # Verify executable
      # --------------------------------------------------

      - name: Verify application executable
        run: |
          test -x \
            build/RetroPhosphor.app/Contents/MacOS/RetroPhosphor

          file \
            build/RetroPhosphor.app/Contents/MacOS/RetroPhosphor

          echo ""
          echo "Executable verified."

      # --------------------------------------------------
      # Create release ZIP
      # --------------------------------------------------

      - name: Create release ZIP
        run: |
          cd build

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            RetroPhosphor.app \
            RetroPhosphor-macOS.zip

          cd ..

          echo "Release ZIP:"
          ls -lh \
            build/RetroPhosphor-macOS.zip

      # --------------------------------------------------
      # Create release manifest
      # --------------------------------------------------

      - name: Create release manifest
        run: |
          APP="build/RetroPhosphor.app"

          {
            echo "RetroPhosphor Release"
            echo "====================="
            echo ""
            echo "Version: 1.0.0"
            echo "Build: 1"
            echo "Minimum macOS: 13.0"
            echo ""
            echo "Bundle ID:"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Contents/Info.plist"

            echo ""
            echo "Executable:"
            ls -lh \
              "$APP/Contents/MacOS/RetroPhosphor"

            echo ""
            echo "ZIP:"
            ls -lh \
              build/RetroPhosphor-macOS.zip

            echo ""
            echo "Code Signature:"
            codesign \
              -dv \
              "$APP" \
              2>&1 || true
          } > build/RELEASE-MANIFEST.txt

          cat build/RELEASE-MANIFEST.txt

      # --------------------------------------------------
      # Upload final application
      # --------------------------------------------------

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-macOS
          path: |
            build/RetroPhosphor.app
            build/RetroPhosphor-macOS.zip
            build/RELEASE-MANIFEST.txt
          if-no-files-found: error

      # --------------------------------------------------
      # Upload render previews
      # --------------------------------------------------

      - name: Upload render previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-render-preview
          path: build/render-preview
          if-no-files-found: warn

      # --------------------------------------------------
      # Upload test report
      # --------------------------------------------------

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-test-report
          path: build/test-output
          if-no-files-found: warn

      # --------------------------------------------------
      # Upload diagnostics
      # --------------------------------------------------

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-build-diagnostics
          path: build/diagnostics
          if-no-files-found: warn
