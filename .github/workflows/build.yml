name: Build macOS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Package
        run: |
          mkdir -p artifacts
          cp .build/release/RetroPhosphor artifacts/RetroPhosphor
          cd artifacts
          zip -r RetroPhosphor-macos.zip RetroPhosphor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-macos
          path: artifacts/RetroPhosphor-macos.zip
