name: Build RetroPhosphor macOS App

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show build environment
        run: |
          echo "========================================"
          echo "MACOS"
          echo "========================================"
          sw_vers
          echo ""
          echo "========================================"
          echo "XCODE"
          echo "========================================"
          xcodebuild -version

          echo ""
          echo "========================================"
          echo "SWIFT"
          echo "========================================"
          swift --version

          echo ""
          echo "========================================"
          echo "ARCHITECTURE"
          echo "========================================"
          uname -m

      - name: Resolve Swift package dependencies
        run: |
          swift package resolve

      - name: Build Swift package
        run: |
          swift build -v

      - name: Run Swift tests
        run: |
          swift test -v

      - name: Create test output directory
        if: always()
        run: |
          mkdir -p build/test-output

      - name: Capture test information
        if: always()
        run: |
          {
            echo "RetroPhosphor automated test run"
            echo "================================"
            echo ""
            echo "Date:"
            date
            echo ""
            echo "macOS:"
            sw_vers
            echo ""
            echo "Swift:"
            swift --version
            echo ""
            echo "Architecture:"
            uname -m
          } > build/test-output/test-summary.txt

      - name: Inspect source and test files
        if: always()
        run: |
          echo "========================================"
          echo "SOURCE FILES"
          echo "========================================"

          find Sources -maxdepth 4 -type f -print | sort \
            | tee build/test-output/source-files.txt

          echo ""
          echo "========================================"
          echo "TEST FILES"
          echo "========================================"

          if [ -d Tests ]; then
            find Tests -maxdepth 4 -type f -print | sort \
              | tee build/test-output/test-files.txt
          else
            echo "No Tests directory found." \
              | tee build/test-output/test-files.txt
          fi

      - name: Inspect build output
        if: always()
        run: |
          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          find .build -maxdepth 8 -type f -print | sort \
            | tee build/test-output/build-files.txt

      - name: Collect rendered PNG previews
        if: always()
        run: |
          mkdir -p build/render-preview

          echo "========================================"
          echo "SEARCHING FOR PNG RENDER PREVIEWS"
          echo "========================================"

          FOUND=0

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Found PNG:"
              echo "$file"

              cp "$file" \
                "build/render-preview/$(basename "$file")"

              FOUND=1
            fi
          done < <(
            find . \
              -type f \
              -iname "*.png" \
              ! -path "./.git/*" \
              ! -path "./.build/*" \
              ! -path "./build/render-preview/*" \
              -print
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "No PNG preview was found."
            echo "The test may have passed without generating a PNG artifact."
          fi

          echo ""
          echo "========================================"
          echo "COLLECTED PREVIEWS"
          echo "========================================"

          find build/render-preview \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      - name: Create render preview report
        if: always()
        run: |
          {
            echo "RetroPhosphor Render Preview"
            echo "============================"
            echo ""
            echo "Date:"
            date
            echo ""
            echo "PNG files:"
            find build/render-preview \
              -maxdepth 1 \
              -type f \
              -print \
              | sort
            echo ""
            echo "File details:"
            find build/render-preview \
              -maxdepth 1 \
              -type f \
              -exec file {} \;
          } > build/render-preview/report.txt

      - name: Create release directory
        run: |
          mkdir -p build/RetroPhosphor

      - name: Locate RetroPhosphor executable
        run: |
          if [ -f ".build/arm64-apple-macosx/debug/RetroPhosphor" ]; then
            EXECUTABLE=".build/arm64-apple-macosx/debug/RetroPhosphor"
          elif [ -f ".build/debug/RetroPhosphor" ]; then
            EXECUTABLE=".build/debug/RetroPhosphor"
          else
            echo "ERROR: RetroPhosphor executable was not found."
            echo ""
            echo "Available files:"
            find .build -maxdepth 8 -type f -print
            exit 1
          fi

          echo "$EXECUTABLE" \
            | tee build/test-output/executable-path.txt

          cp "$EXECUTABLE" \
            "build/RetroPhosphor/RetroPhosphor"

      - name: Inspect executable
        run: |
          echo "========================================"
          echo "EXECUTABLE"
          echo "========================================"

          file "build/RetroPhosphor/RetroPhosphor"

          echo ""
          ls -lh "build/RetroPhosphor/RetroPhosphor"

      - name: Make executable runnable
        run: |
          chmod +x "build/RetroPhosphor/RetroPhosphor"

      - name: Create app bundle
        run: |
          APP="build/RetroPhosphor/RetroPhosphor.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp \
            "build/RetroPhosphor/RetroPhosphor" \
            "$APP/Contents/MacOS/RetroPhosphor"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>

              <key>CFBundleExecutable</key>
              <string>RetroPhosphor</string>

              <key>CFBundleIdentifier</key>
              <string>com.retro.phosphor</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>RetroPhosphor</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>

              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Verify app bundle
        run: |
          APP="build/RetroPhosphor/RetroPhosphor.app"

          echo "========================================"
          echo "APP BUNDLE"
          echo "========================================"

          find "$APP" -maxdepth 5 -print | sort

          echo ""
          echo "========================================"
          echo "INFO.PLIST"
          echo "========================================"

          plutil -p "$APP/Contents/Info.plist"

          echo ""
          echo "========================================"
          echo "APP EXECUTABLE"
          echo "========================================"

          file "$APP/Contents/MacOS/RetroPhosphor"

      - name: Ad-hoc code sign app
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            "build/RetroPhosphor/RetroPhosphor.app"

      - name: Verify code signature
        run: |
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "build/RetroPhosphor/RetroPhosphor.app"

      - name: Inspect final app
        run: |
          echo "========================================"
          echo "FINAL APP"
          echo "========================================"

          ls -lah "build/RetroPhosphor"

          echo ""
          du -sh "build/RetroPhosphor/RetroPhosphor.app"

      - name: Create ZIP
        run: |
          cd build/RetroPhosphor

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "RetroPhosphor.app" \
            "RetroPhosphor-macOS.zip"

      - name: Verify ZIP
        run: |
          echo "========================================"
          echo "ZIP"
          echo "========================================"

          ls -lh \
            "build/RetroPhosphor/RetroPhosphor-macOS.zip"

          echo ""
          echo "ZIP CONTENTS"

          unzip -l \
            "build/RetroPhosphor/RetroPhosphor-macOS.zip"

      - name: Create final build report
        if: always()
        run: |
          REPORT="build/test-output/final-build-report.txt"

          {
            echo "RetroPhosphor Build Report"
            echo "==========================="
            echo ""
            echo "Build date:"
            date
            echo ""
            echo "macOS:"
            sw_vers
            echo ""
            echo "Architecture:"
            uname -m
            echo ""
            echo "Swift:"
            swift --version
            echo ""
            echo "App:"
            ls -lh "build/RetroPhosphor/RetroPhosphor.app"
            echo ""
            echo "ZIP:"
            ls -lh "build/RetroPhosphor/RetroPhosphor-macOS.zip"
          } > "$REPORT"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-macOS
          path: build/RetroPhosphor/RetroPhosphor-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload render preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-render-preview
          path: build/render-preview
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-test-report
          path: build/test-output
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-build-diagnostics
          path: |
            .build/
            build/
          if-no-files-found: warn
          retention-days: 7
