name: Build RetroPhosphor macOS App

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show macOS version
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: |
          swift package resolve

      - name: Build Swift package
        run: |
          swift build -v

      - name: Run Swift tests
        run: |
          swift test -v

      - name: Create release directory
        run: |
          mkdir -p build/RetroPhosphor

      - name: Locate built executable
        run: |
          echo "Build directory:"
          find .build -maxdepth 4 -type f -perm +111 -print || true

      - name: Package Swift executable
        run: |
          if [ -f ".build/arm64-apple-macosx/debug/RetroPhosphor" ]; then
            cp ".build/arm64-apple-macosx/debug/RetroPhosphor" \
              "build/RetroPhosphor/RetroPhosphor"
          elif [ -f ".build/debug/RetroPhosphor" ]; then
            cp ".build/debug/RetroPhosphor" \
              "build/RetroPhosphor/RetroPhosphor"
          else
            echo "ERROR: RetroPhosphor executable was not found."
            echo "Available build files:"
            find .build -type f -maxdepth 6 -print
            exit 1
          fi

      - name: Make executable runnable
        run: |
          chmod +x "build/RetroPhosphor/RetroPhosphor"

      - name: Create app bundle
        run: |
          APP="build/RetroPhosphor/RetroPhosphor.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp "build/RetroPhosphor/RetroPhosphor" \
             "$APP/Contents/MacOS/RetroPhosphor"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>

              <key>CFBundleExecutable</key>
              <string>RetroPhosphor</string>

              <key>CFBundleIdentifier</key>
              <string>com.retro.phosphor</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>RetroPhosphor</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>

              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Verify app bundle
        run: |
          echo "App bundle:"
          find "build/RetroPhosphor/RetroPhosphor.app" -maxdepth 4 -print

          echo ""
          echo "Info.plist:"
          plutil -p "build/RetroPhosphor/RetroPhosphor.app/Contents/Info.plist"

          echo ""
          echo "Executable:"
          file "build/RetroPhosphor/RetroPhosphor.app/Contents/MacOS/RetroPhosphor"

      - name: Ad-hoc code sign app
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            "build/RetroPhosphor/RetroPhosphor.app"

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "build/RetroPhosphor/RetroPhosphor.app"

      - name: Create ZIP
        run: |
          cd build/RetroPhosphor
          ditto -c -k --sequesterRsrc --keepParent \
            "RetroPhosphor.app" \
            "RetroPhosphor-macOS.zip"

      - name: List final build
        run: |
          echo "=============================="
          echo "FINAL BUILD"
          echo "=============================="
          ls -lah "build/RetroPhosphor"
          echo ""
          echo "App size:"
          du -sh "build/RetroPhosphor/RetroPhosphor.app"
          echo ""
          echo "ZIP size:"
          du -sh "build/RetroPhosphor/RetroPhosphor-macOS.zip"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-macOS
          path: build/RetroPhosphor/RetroPhosphor-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-build-diagnostics
          path: |
            .build/
            build/
          if-no-files-found: warn
          retention-days: 7
