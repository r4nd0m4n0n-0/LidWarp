name: Build macOS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Create app bundle
        run: |
          APP_DIR="artifacts/RetroPhosphor.app"

          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp .build/release/RetroPhosphor "$APP_DIR/Contents/MacOS/RetroPhosphor"

          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>RetroPhosphor</string>
              <key>CFBundleIdentifier</key>
              <string>com.retro-phosphor.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>RetroPhosphor</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
          </dict>
          </plist>
          PLIST

          chmod +x "$APP_DIR/Contents/MacOS/RetroPhosphor"

      - name: Package
        run: |
          cd artifacts
          zip -r RetroPhosphor-macos.zip RetroPhosphor.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroPhosphor-macos
          path: artifacts/RetroPhosphor-macos.zip
